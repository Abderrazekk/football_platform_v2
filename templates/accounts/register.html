<!-- templates/accounts/register.html -->
{% extends "base.html" %}
{% block title %}Inscription — Football AI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-8">
  <h1 class="text-2xl font-bold text-slate-900 mb-6">Créer un compte</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit"
            class="w-full py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-semibold transition">
      S'inscrire
    </button>
  </form>
  <p class="mt-4 text-sm text-center text-slate-600">
    Déjà inscrit ?
    <a href="{% url 'accounts:login' %}" class="text-emerald-600 font-semibold hover:underline">Connexion</a>
  </p>
</div>
{% endblock %}
